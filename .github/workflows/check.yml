name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline workflows
        run: python -m unittest discover -s tests -v
      - name: Walk through demo
        run: python demo.py
      - name: Check reviewed manifest
        run: python manifest.py
      - name: Bounded retrieval benchmark
        run: python benchmark.py --sizes 20 --repeats 1
      - name: Audit release and history
        run: python audit.py
